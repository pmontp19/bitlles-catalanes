<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#cfc4ad">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Bitlles catalanes en 3D per al mòbil. Tomba'n cinc i deixa'n una.">
  <title>Bitlla!</title>
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
  <div id="stage">
    <canvas id="scene"></canvas>
    <div id="hud" hidden>
      <div class="top">
        <div class="score"><b id="score">0</b><span>punts</span></div>
        <div class="mid">
          <div id="tirada" class="tirada"></div>
          <div class="chips"><span id="mult" class="chip gold" hidden></span><span id="wind" class="chip" hidden></span></div>
        </div>
        <div id="pins" class="pins" aria-label="Estat de les bitlles"></div>
      </div>
      <div id="goal" class="goal" hidden></div>
      <div id="readout" class="readout" hidden></div>
      <div id="hint" class="hint"></div>
      <div id="rack" class="rack"></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="prot" class="prot" hidden></div>
      <div id="ghost" class="ghost" hidden></div>
    </div>
    <div id="overlay" hidden></div>
    <div id="loading">Plantant les bitlles…</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
